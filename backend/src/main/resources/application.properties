server.port=8080
spring.application.name=copo-backend

# MongoDB Connection
spring.data.mongodb.uri=mongodb://localhost:27017/copo_db
spring.data.mongodb.auto-index-creation=true

# File upload limits for Excel marksheets
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Logging
logging.level.com.obe.copo=INFO

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

